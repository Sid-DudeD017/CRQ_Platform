[pytest]
# tests/ used to mix one real automated suite (test_api.py) with several ad
# hoc exploratory scripts left over from development (test_chat.py,
# test_sim.py, a whole tests/misc/ folder, etc.) that had module-level side
# effects (real HTTP calls, some even asyncio.run() at import time) and were
# never meant to be collected automatically - python_files was scoped down
# to test_api.py alone to keep those out of `pytest` (and CI). Those scripts
# have since been removed from the repo (repo hygiene cleanup), so
# collection is back to pytest's normal test_*.py glob - test_api.py (API
# layer), test_monte_carlo.py and test_ingestion_engine.py (pure-function
# unit tests, no DB), and test_risk_engine.py (FAIR input derivation, via a
# throwaway in-memory SQLite DB) all run automatically now.
testpaths = tests
python_files = test_*.py
