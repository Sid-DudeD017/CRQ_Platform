! Sample Cisco IOS-style device config for the CRQ Platform Ingestion Engine.
! This is a deliberately small, illustrative excerpt (not a real device
! export) crafted to exercise both "control present" and "control gap"
! findings so a first-time upload shows a realistic mix to review.
hostname EDGE-RTR-01
!
enable password cisco123
!
service password-encryption
!
ip http secure-server
!
snmp-server community public RO
!
interface GigabitEthernet0/1
 description Uplink to core switch
 switchport port-security
!
ip verify unicast source reachable-via rx
!
logging host 10.0.0.55
ntp server 10.0.0.1
!
router bgp 65001
 neighbor 203.0.113.5 remote-as 65010
 neighbor 203.0.113.9 remote-as 65020
 neighbor 203.0.113.9 password Str0ngP@ss
!
end
