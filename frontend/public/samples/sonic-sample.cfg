! Sample SONiC-style device config for the CRQ Platform Ingestion Engine.
! SONiC's CLI shares the same command grammar the parser looks for
! (see backend/ingestion_engine.py) - this excerpt is illustrative only,
! not a real device export, and is meant to be a quick way to see the
! Ingestion Engine work without needing your own config on hand.
hostname sonic-tor-03
!
service password-encryption
!
snmp-server community private RO
!
ip http secure-server
!
interface Ethernet0
 description Server-facing port
 switchport port-security
!
ip verify unicast reverse-path
!
logging host 10.1.1.20
ntp server 10.1.1.1
!
router bgp 65100
 neighbor 198.51.100.2 remote-as 65200
!
end
