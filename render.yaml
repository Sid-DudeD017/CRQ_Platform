# Render "Blueprint" for the FastAPI backend. In the Render dashboard:
# New -> Blueprint -> connect this repo -> Render reads this file and
# pre-fills everything below except the secrets marked sync: false,
# which you paste in yourself after the service is created.
services:
  - type: web
    name: crq-platform-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips=*"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: DATABASE_URL
        sync: false   # paste your Neon connection string here
      - key: GROQ_API_KEY
        sync: false   # your (rotated) Groq key
      - key: SECRET_KEY
        generateValue: true   # Render generates a real random JWT signing secret
      - key: ALLOWED_ORIGINS
        sync: false   # optional - your deployed Vercel URL(s), comma-separated
                       # (e.g. https://crq-platform.vercel.app). Leave this
                       # var out of the dashboard entirely to keep the code's
                       # default allowlist (backend/main.py's _default_origins),
                       # which already includes that exact placeholder domain -
                       # only needed if your Vercel URL differs from it.
