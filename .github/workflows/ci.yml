name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      # test_api.py forces a throwaway local SQLite DB and disables the
      # real Groq call itself (see its module docstring), and
      # test_monte_carlo.py / test_ingestion_engine.py / test_risk_engine.py
      # are pure-function or in-memory-SQLite unit tests - the whole suite
      # runs fully offline, no secrets needed here.
      - name: Run backend test suite
        run: pytest -v

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
